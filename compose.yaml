services:
  app:
    init: true
    image: ${IMAGE:-untitled:local}
    build:
      context: .
      target: runtime
    container_name: ${CONTAINER_NAME:-untitled}
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-}
      DATA_DIR: /data
      LOGS_DIR: /logs
      # for testing only
      API_KEY: ${API_KEY:-}
      TEST: ${TEST:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}"
    restart: on-failure:5
    stop_grace_period: 10s
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${LOGS_PATH:-./logs}:/logs
